[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-flow"
version = "4.0.0"
description = "그룹 챗 오케스트레이션 시스템 - Manager Agent가 전문화된 Worker Agent들을 조율하여 복잡한 소프트웨어 개발 작업을 자동화"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "simdaseul"}
]
dependencies = [
    "aiofiles>=23.1.0",
    "anthropic>=0.18.0",
    "claude-agent-sdk>=0.1.0",
    "click>=8.0.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "rapidfuzz>=3.0.0",
    "rich>=13.7.0",
    "sse-starlette>=2.0.0",
    "structlog>=23.1.0",
    "textual>=0.47.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "ipython>=8.0.0",
]

[project.scripts]
claude-flow-web = "src.presentation.web.app:main"
claude-flow = "src.presentation.tui.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.setuptools.package-data]
"*" = ["*.tcss", "*.txt", "*.json", "*.yaml", "*.yml"]

[tool.setuptools]
include-package-data = true

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # 점진적 타입 힌팅 적용 (나중에 true로 변경)
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
pretty = true
show_error_codes = true
show_error_context = true

# 서드파티 라이브러리 타입 무시
[[tool.mypy.overrides]]
module = [
    "anthropic.*",
    "claude_agent_sdk.*",
    "sse_starlette.*",
    "structlog.*",
    "rapidfuzz.*",
]
ignore_missing_imports = true
